<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 400" width="1520" height="400">
  <!-- README banner; the logo is docs/logo.svg, inlined. PNG: node scripts/brand-render.mjs -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0d16"/><stop offset="1" stop-color="#151633"/></linearGradient>
    <radialGradient id="spot" cx=".8" cy=".2" r=".6"><stop offset="0" stop-color="#6a4cff" stop-opacity=".28"/><stop offset="1" stop-color="#6a4cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="frame" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3d8bff"/><stop offset=".55" stop-color="#6a4cff"/><stop offset="1" stop-color="#c04dff"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3d8bff"/><stop offset="1" stop-color="#c04dff"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171c2e"/><stop offset="1" stop-color="#0b0d16"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1f4a"/><stop offset="1" stop-color="#0e1024"/></linearGradient>
    <linearGradient id="couch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6fb"/><stop offset="1" stop-color="#d5dae6"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1520" height="400" rx="32" fill="url(#bg)"/>
  <rect width="1520" height="400" rx="32" fill="url(#spot)"/>

  <g transform="translate(56 56) scale(.5625)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)" stroke="#262c44" stroke-width="6"/>
    <rect x="88" y="92" width="336" height="228" rx="40" fill="none" stroke="url(#frame)" stroke-width="30" filter="url(#glow)" opacity=".6"/>
    <rect x="88" y="92" width="336" height="228" rx="40" fill="url(#screen)" stroke="url(#frame)" stroke-width="30"/>
    <rect x="132" y="146" width="62" height="84" rx="12" fill="#3d8bff" opacity=".45"/>
    <rect x="212" y="134" width="88" height="110" rx="14" fill="#6a4cff" stroke="#fff" stroke-width="8"/>
    <rect x="318" y="146" width="62" height="84" rx="12" fill="#c04dff" opacity=".45"/>
    <g stroke="#0b0d16" stroke-width="14" fill="url(#couch)">
      <rect x="78" y="300" width="86" height="118" rx="36"/>
      <rect x="348" y="300" width="86" height="118" rx="36"/>
      <rect x="124" y="270" width="264" height="148" rx="44"/>
    </g>
    <rect x="116" y="418" width="22" height="30" rx="8" fill="#d5dae6"/>
    <rect x="374" y="418" width="22" height="30" rx="8" fill="#d5dae6"/>
    <g fill="url(#frame)"><circle cx="256" cy="306" r="12"/><circle cx="256" cy="362" r="12"/><circle cx="228" cy="334" r="12"/><circle cx="284" cy="334" r="12"/></g>
  </g>

  <text x="402" y="208" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-2" fill="#eef1f8">Couch<tspan fill="url(#word)">HUD</tspan></text>
  <text x="408" y="268" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="38" fill="#9aa3b8">Die Konsolen-Oberfläche für deinen Windows-PC am Fernseher</text>
  <text x="408" y="322" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#7f8cff">Controller first · Steam, Epic &amp; Co. in einer Bibliothek · Open Source</text>
</svg>
